<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeux SST Éveil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Plateau de jeu de formation : bandeau marine (logo), table de jeu claire, couleurs de sécurité normalisées */
:root{
  --ink:#16213A; --paper:#F6F7F9; --card:#FFFFFF; --line:#D9DDE5; --muted:#5B6476;
  --red:#C8102E; --green:#1E8E5A; --amber:#E0A100; --blue:#2F6FB0; --navy:#1F2A44; --gold:#D9B45A;
  --shadow:0 1px 2px rgba(22,33,58,.08),0 6px 18px rgba(22,33,58,.08);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#E9ECF3;--paper:#0F1626;--card:#18223A;--line:#2C3756;--muted:#A3ACC0;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF3;--paper:#0F1626;--card:#18223A;--line:#2C3756;--muted:#A3ACC0;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
.top{background:var(--navy);color:#fff}
.top .in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px;margin:0 auto}
.top img{height:46px;width:auto;display:block}
.top .who{margin-left:auto;font-size:13px;color:#C9D0DE;text-align:right}
.top .who b{display:block;color:#fff;font-family:var(--f-display);font-size:15px;letter-spacing:.02em}
main{max-width:1100px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.05}
h2{font-size:24px;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{font:700 15px var(--f-body);border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--navy);color:#fff}
.btn:focus-visible,.choice:focus-visible,.tile:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Accueil */
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:20px}
.tile{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.tile .tag{align-self:flex-start;color:#fff;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.tile h2{font-size:28px}
.tile p{margin:0;color:var(--muted)}
.wedges{display:flex;gap:6px}.wedges i{width:22px;height:22px;border-radius:50%;display:block}
/* Équipes */
.setup{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px;display:grid;gap:12px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.teams label{display:flex;align-items:center;gap:8px;font-weight:700}
.teams input{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
/* Trivial */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:16px}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.score{display:grid;gap:10px}
.team{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:2px solid transparent}
.team.on{border-color:var(--ink)}
.team .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cam{width:44px;height:44px;flex:none}
.wheelwrap{display:grid;place-items:center;gap:14px;padding:6px 0}
#wheel{width:min(320px,80vw);height:auto;transition:transform 2.6s cubic-bezier(.17,.8,.2,1)}
.pointer{width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:22px solid var(--ink);margin-bottom:-18px;z-index:2}
.qcard{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-top:6px}
.qcard .hd{color:#fff;padding:10px 16px;font-weight:700;font-family:var(--f-display);letter-spacing:.02em}
.qcard .bd{padding:16px;display:grid;gap:10px}
.qcard .q{font-size:19px;font-weight:700}
.choice{display:block;width:100%;text-align:left;font:inherit;padding:11px 14px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.choice.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--paper))}
.choice.ko{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--paper))}
.expl{border-left:4px solid var(--blue);padding:8px 12px;background:var(--paper);border-radius:0 8px 8px 0}
.msg{font-family:var(--f-display);font-weight:700;font-size:20px}
/* Oie */
.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.sq{position:relative;aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;min-width:0;overflow:hidden}
.sq .n{font-size:11px;font-weight:700;color:var(--muted)}
.sq .lb{font-size:10px;font-weight:700;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.sq.danger{background:var(--red);color:#fff;border-color:var(--red)}.sq.danger .n{color:#ffd9de}
.sq.bonne{background:var(--green);color:#fff;border-color:var(--green)}.sq.bonne .n{color:#d3f2e2}
.sq.chiffre{background:var(--blue);color:#fff;border-color:var(--blue)}.sq.chiffre .n{color:#dbe8f7}
.sq.accident{background:#111827;color:#fff;border-color:#111827}.sq.accident .n{color:#c8ccd6}
.sq.duerp{background:var(--amber);color:#1b1b1b;border-color:var(--amber)}.sq.duerp .n{color:#5a4600}
.sq.depart,.sq.arrivee{background:var(--navy);color:#fff;border-color:var(--navy)}.sq.depart .n,.sq.arrivee .n{color:var(--gold)}
.sq.ghost{visibility:hidden}
.pawns{position:absolute;right:3px;bottom:3px;display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.pawn{width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.4)}
@media (max-width:560px){.board{grid-template-columns:repeat(6,minmax(0,1fr))}.sq .lb{font-size:8px}}
.die{width:74px;height:74px;border-radius:14px;background:var(--card);border:2px solid var(--ink);display:grid;place-items:center;font:800 38px var(--f-display)}
.die.roll{animation:shake .5s}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}75%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){#wheel{transition:none}.die.roll{animation:none}}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:3px;display:block}
.foot{margin-top:28px;font-size:13px;color:var(--muted);display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:space-between}
.win{text-align:center;padding:26px;display:grid;gap:12px;place-items:center}
.win h2{font-size:34px}
</style>
</head><body>

<script>
const DATA = {"TRIVIAL":{"cats":[{"id":"pro","nom":"Protéger","couleur":"#E07A1F"},{"id":"exa","nom":"Examiner et alerter","couleur":"#2F6FB0"},{"id":"sai","nom":"Saignement et étouffement","couleur":"#C8102E"},{"id":"mal","nom":"Malaise, brûlures, plaies","couleur":"#7B4FA0"},{"id":"rcp","nom":"Inconscience, RCP, DAE","couleur":"#1E8E5A"},{"id":"cad","nom":"Cadre et rôle du SST","couleur":"#C99A06"}],"q":{"pro":[["Quelle est la première étape du plan d'intervention du SST ?",["Protéger","Examiner","Faire alerter","Secourir"],"On protège d'abord pour éviter un sur-accident."],["Un collègue électrisé est encore en contact avec la machine. Que faites-vous d'abord ?",["Je coupe le courant","Je le tire par le bras","J'appelle le 15","Je lui parle pour le rassurer"],"Tant que le courant passe, toucher la victime vous électrise aussi."],["Quand peut-on réaliser un dégagement d'urgence ?",["Danger réel, vital, immédiat et impossible à supprimer ou isoler","Dès que la victime est au sol","Quand les secours tardent","Toujours avant d'examiner"],"C'est l'exception : il peut aggraver un traumatisme."],["Comment déplace-t-on une victime lors d'un dégagement d'urgence ?",["En la tirant au sol par les poignets ou les chevilles","En la soulevant par la taille","En la tirant par le col","En la portant à deux sur les épaules"],"On la traîne au sol, sans la soulever, jusqu'à une zone sûre."],["Vous ne pouvez ni supprimer ni isoler le danger sans vous exposer. Que faites-vous ?",["Je fais alerter et j'empêche les autres d'approcher","J'interviens quand même, vite","Je dégage la victime","Je retourne à mon poste"],"Le sauveteur ne doit jamais devenir une deuxième victime."],["Qu'appelle-t-on un sur-accident ?",["Un nouvel accident touchant la victime, un témoin ou le sauveteur","Un accident très grave","Un accident de trajet","Une rechute de la victime"],"Protéger sert justement à l'éviter."],["Fuite de gaz dans un local où une victime est au sol. Que ne faut-il surtout pas faire ?",[" lice municipale","Joindre le centre antipoison","Signaler une panne de courant"],"Il s'adresse notamment aux personnes sourdes ou malentendantes."],["Quand raccroche-t-on lors d'un appel aux secours ?",["Quand l'interlocuteur le demande","Dès que le message est transmis","Au bout d'une minute","Jamais"],"Les secours peuvent avoir besoin de précisions."],["Que veut dire « faire alerter » ?",["Désigner un témoin, lui donner le message et lui demander de revenir confirmer","Appeler soi-même dans tous les cas","Crier « au secours »","Envoyer un SMS à son chef"],"Le SST reste ainsi auprès de la victime."],["Une respiration bruyante, irrégulière ou très lente doit être considérée comme…",["une absence de respiration","une respiration normale","un simple malaise","un étouffement partiel"],"Ces « gasps » accompagnent souvent l'arrêt cardiaque."],["Que contient le message d'alerte ?",["Qui, où, quoi, combien de victimes, leur état, ce qui a été fait","Seulement le nom de la victime","Seulement l'adresse","Le nom de l'entreprise et de son directeur"],"Un message complet permet d'envoyer les bons secours."]],"sai":[["Une victime saigne abondamment de l'avant-bras. Premier geste ?",["Comprimer l'endroit qui saigne","Poser un garrot immédiatement","Lever le bras sans comprimer","Désinfecter la plaie"],"La compression manuelle est le premier geste."],["Quand pose-t-on un garrot ?",["Compression impossible ou inefficace sur un membre","Pour toute plaie qui saigne","Sur une plaie du cou","Sur une plaie de la tête"],"Le garrot ne concerne que les membres."],["Après la pose d'un garrot, que faut-il faire ?",["Noter l'heure et ne jamais le desserrer","Le desserrer toutes les 10 minutes","Le cacher sous un vêtement","L'enlever dès que ça ne saigne plus"],"Seuls les secours spécialisés le retireront."],["Où place-t-on le garrot ?",["Quelques centimètres au-dessus de la plaie, jamais sur une articulation","Sur la plaie","Sous la plaie","Sur le coude"],"Au-dessus de la plaie, entre la pla   const drawScore = () => { score.innerHTML = ''; teams.forEach((t, i) => score.append($(`<div class="team ${i === cur ? 'on' : ''}"><span class="dot" style="background:${t.col}"></span><span class="nm">${esc(t.nm)}</span>${camSvg(t.owned)}<b>${t.owned.size}/6</b></div>`))); };
  const turn = () => { busy = false; drawScore(); play.innerHTML = '';
    play.append($(`<div class="msg" style="color:${teams[cur].col}">À ${esc(teams[cur].nm)} de jouer</div>`));
    const w = $(`<div class="wheelwrap"><div class="pointer"></div>${wheelSvg()}<button class="btn red" type="button" id="spin">Tourner la roue</button></div>`); play.append(w);
    const wheel = w.querySelector('#wheel'); wheel.style.transform = `rotate(${rot}deg)`;
    w.querySelector('#spin').onclick = (e) => { if (busy) return; busy = true; e.target.disabled = true;
      const k = Math.floor(Math.random() * 6), seg = 360 / 6; const target = 360 - (k * seg + seg / 2);
      rot += 1440 + ((target - rot % 360) + 360) % 360; wheel.style.transform = `rotate(${rot}deg)`;
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; setTimeout(() => ask(T.cats[k]), reduce ? 50 : 2700); }; };
  const ask = (cat) => { if (!decks[cat.id].length) decks[cat.id] = shuffle(T.q[cat.id]); const [q, ch, ex] = decks[cat.id].pop(); const good = ch[0];
    play.innerHTML = ''; const card = $(`<div class="qcard"><div class="hd" style="background:${cat.couleur}">${esc(cat.nom)}</div><div class="bd"><div class="q">${esc(q)}</div></div></div>`); const bd = card.querySelector('.bd');
    shuffle(ch).forEach(c => { const b = $(`<button class="choice" type="button">${esc(c)}</button>`); b.onclick = () => answer(b, c === good, good, ex, cat, bd); bd.append(b); });
    play.append($(`<div class="msg" style="color:${teams[cur].col};margin-bottom:6px">${esc(teams[cur].nm)}</div>`), card); };
  const answer = (btn, ok, good, ex, cat, bd) => { bd.querySelectorAll('.choice').forEach(b => { b.disabled = true; if (b.textContent === good) b.classList.add('ok'); }); if (!ok) btn.classList.add('ko');
    const t = teams[cur]; let txt;
    if (ok) { const isNew = !t.owned.has(cat.id); t.owned.add(cat.id); txt = isNew ? `Bonne réponse : quartier « ${cat.nom} » gagné ! ${esc(t.nm)} rejoue.` : `Bonne réponse ! Quartier déjà gagné, ${esc(t.nm)} rejoue.`; }
    else txt = 'Mauvaise réponse : la main passe.';
    bd.append($(`<div class="expl"><b>${ok ? '✔' : '✘'} ${txt}</b><br>${esc(ex)}</div>`));
    drawScore();
    if (t.owned.size === 6) { bd.append($(`<button class="btn green" type="button">Voir le résultat</button>`)); bd.lastChild.onclick = () => { play.innerHTML = ''; play.append($(`<div class="win"><div class="eyebrow">Partie terminée</div><h2 style="color:${t.col}">${esc(t.nm)} gagne !</h2><p>Les six quartiers du secours sont réunis.</p><button class="btn red" type="button">Rejouer</button></div>`)); play.querySelector('.btn').onclick = trivialGame; }; return; }
    const nx = $(`<button class="btn" type="button">${ok ? 'Rejouer' : 'Équipe suivante'}</button>`); nx.onclick = () => { if (!ok) cur = (cur + 1) % teams.length; turn(); }; bd.append(nx); nx.focus(); };
  turn();
}

// ---------------- JEU DE L'OIE ----------------
const LABEL = { depart: 'Départ', arrivee: 'Zéro accident', danger: 'Danger', bonne: 'Bonne pratique', chiffre: 'Question', accident: 'Accident', duerp: 'Document unique', n: '' };
function oieStart() {
  app.innerHTML = '';
  app.append($(`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">Jeu de l'oie · Prévention</div><h1>Le parcours prévention</h1></div><button class="btn ghost" type="button" onclick="location.hash=''">Accueil</button></div>`));
  app.append($(`<p style="max-width:65ch;color:var(--muted);margin:10px 0 0">Lancez le dé et avancez. <b>Danger</b> : trouvez la bonne réaction, sinon reculez de 3 cases. <b>Bonne pratique</b> : avancez. <b>Question</b> : bonne réponse, avancez de 2. <b>Accident</b> : passez un tour. <b>Document unique</b> : rejouez. La première équipe sur la case 40 gagne.</p>`));
  app.append(teamSetup(oieGame, 'Commencer le parcours'), foot());
}
function oieGame() {
  const teams = state.teams.map((nm, i) => ({ nm, col: TEAMCOL[i], pos: 0, skip: false }));
  const dD = shuffle(O.dangers), dC = shuffle(O.chiffres), dB = shuffle(O.bonnes); let iD = 0, iC = 0, iB = 0, cur = 0;
  app.innerHTML = '';
  app.append($(`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">Jeu de l'oie · Prévention</div><h1>Le parcours prévention</h1></div><button class="btn ghost" type="button" onclick="location.hash=''">Quitter</button></div>`));
  const lay = $(`<div class="layout"><div class="panel"><div class="board" id="board"></div><div class="legend"><span><i style="background:var(--red)"></i>Danger</span><span><i style="background:var(--green)"></i>Bonne pratique</span><span><i style="background:var(--blue)"></i>Question</span><span><i style="background:#111827"></i>Accident</span><span><i style="background:var(--amber)"></i>Document unique</span></div></div><div class="panel" id="side"></div></div>`);
  app.append(lay, foot());
  const board = lay.querySelector('#board'), side = lay.querySelector('#side');
  const drawBoard = () => { board.innerHTML = '';
    O.cases.forEach((t, i) => { const sq = $(`<div class="sq ${t}"><span class="n">${i}</span><span class="lb">${LABEL[t]}</span><div class="pawns"></div></div>`);
      teams.forEach(tm => { if (tm.pos === i) sq.querySelector('.pawns').append($(`<span class="pawn" style="background:${tm.col}" title="${esc(tm.nm)}"></span>`)); }); board.append(sq); }); };
  const move = (n) => { const t = teams[cur]; t.pos = Math.max(0, Math.min(40, t.pos + n)); drawBoard(); };
  const head = () => `<div class="score" style="margin-bottom:12px">${teams.map((t, i) => `<div class="team ${i === cur ? 'on' : ''}"><span class="dot" style="background:${t.col}"></span><span class="nm">${esc(t.nm)}</span><b>case ${t.pos}</b>${t.skip ? ' · passe' : ''}</div>`).join('')}</div>`;
  const next = (again) => { if (!again) cur = (cur + 1) % teams.length; turn(); };
  const turn = () => { drawBoard(); const t = teams[cur]; side.innerHTML = head();
    if (t.skip) { t.skip = false; side.append($(`<div class="expl"><b>${esc(t.nm)}</b> passe son tour : le SST intervient sur l'accident.</div>`)); const b = $(`<button class="btn" type="button" style="margin-top:12px">Équipe suivante</button>`); b.onclick = () => next(false); side.append(b); return; }
    const box = $(`<div class="wheelwrap"><div class="msg" style="color:${t.col}">À ${esc(t.nm)} de jouer</div><div class="die" id="die">?</div><button class="btn red" type="button" id="roll">Lancer le dé</button></div>`); side.append(box);
    box.querySelector('#roll').onclick = (e) => { e.target.disabled = true; const d = box.querySelector('#die'); d.classList.remove('roll'); void d.offsetWidth; d.classList.add('roll');
      let k = 0; const iv = setInterval(() => { d.textContent = 1 + Math.floor(Math.random() * 6); if (++k > 6) { clearInterval(iv); const v = 1 + Math.floor(Math.random() * 6); d.textContent = v; move(v); setTimeout(land, 350); } }, 70); }; };
  const land = () => { const t = teams[cur], type = O.cases[t.pos]; const out = $(`<div style="display:grid;gap:10px;margin-top:6px"></div>`); side.append(out);
    const cont = (again, label) => { const b = $(`<button class="btn" type="button">${label || (again ? 'Rejouer' : 'Équipe suivante')}</button>`); b.onclick = () => next(again); out.append(b); b.focus(); };
    if (t.pos >= 40) { side.innerHTML = ''; side.append($(`<div class="win"><div class="eyebrow">Case 40</div><h2 style="color:${t.col}">${esc(t.nm)} atteint « Zéro accident » !</h2><p>Repérer, supprimer ou réduire, informer : la prévention est gagnante.</p><button class="btn green" type="button">Rejouer</button></div>`)); side.querySelector('.btn').onclick = oieGame; return; }
    if (type === 'danger' || type === 'chiffre') { const isD = type === 'danger'; const it = isD ? dD[iD++ % dD.length] : dC[iC++ % dC.length]; const [q, ch, ex] = it; const good = ch[0];
      const card = $(`<div class="qcard"><div class="hd" style="background:${isD ? 'var(--red)' : 'var(--blue)'}">${isD ? 'Situation dangereuse · que faites-vous ?' : 'Question prévention'}</div><div class="bd"><div class="q">${esc(q)}</div></div></div>`); const bd = card.querySelector('.bd'); out.append(card);
      shuffle(ch).forEach(c => { const b = $(`<button class="choice" type="button">${esc(c)}</button>`); b.onclick = () => { bd.querySelectorAll('.choice').forEach(x => { x.disabled = true; if (x.textContent === good) x.classList.add('ok'); }); const ok = c === good; if (!ok) b.classList.add('ko');
        let res = ok ? (isD ? 'Bonne réaction : vous restez sur la case.' : 'Bonne réponse : avancez de 2 cases.') : (isD ? 'Mauvaise réaction : reculez de 3 cases.' : 'Mauvaise réponse : vous restez sur la case.');
        if (isD && !ok) move(-3); if (!isD && ok) move(2); side.querySelector('.score').outerHTML = head();
        bd.append($(`<div class="expl"><b>${ok ? '✔' : '✘'} ${res}</b><br>${esc(ex)}</div>`)); if (teams[cur].pos >= 40) { const b2 = $(`<button class="btn green" type="button">Voir le résultat</button>`); b2.onclick = land; bd.append(b2); return; } cont(false); }; bd.append(b); });
      return; }
    if (type === 'bonne') { const [txt, n] = dB[iB++ % dB.length]; out.append($(`<div class="qcard"><div class="hd" style="background:var(--green)">Bonne pratique</div><div class="bd"><div class="q">${esc(txt)}</div><div>Avancez de ${n} cases.</div></div></div>`)); move(n); side.querySelector('.score').outerHTML = head(); if (teams[cur].pos >= 40) { const b2 = $(`<button class="btn green" type="button">Voir le résultat</button>`); b2.onclick = land; out.append(b2); return; } return cont(false); }
    if (type === 'accident') { t.skip = true; out.append($(`<div class="qcard"><div class="hd" style="background:#111827">Accident</div><div class="bd"><div class="q">Un accident vient de se produire.</div><div>Le SST intervient : protéger, examiner, faire alerter, secourir. Vous passez votre prochain tour.</div></div></div>`)); return cont(false); }
    if (type === 'duerp') { out.append($(`<div class="qcard"><div class="hd" style="background:var(--amber);color:#1b1b1b">Document unique</div><div class="bd"><div class="q">Vous consultez le document unique d'évaluation des risques.</div><div>Vous connaissez les risques de votre poste : rejouez !</div></div></div>`)); return cont(true); }
    out.append($(`<div class="expl">Case ${t.pos} : rien à signaler, le travail continue en sécurité.</div>`)); cont(false); };
  turn();
}

function route() { const h = location.hash.replace('#', ''); if (h === 'trivial') trivialStart(); else if (h === 'oie') oieStart(); else home(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route); route();
</script>
